[package]
name = "soltape-decoder-napi"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
soltape-decoder-core = { path = "../core" }
napi = { version = "3", default-features = false, features = ["napi6"] }
napi-derive = "3"
bs58 = "0.5"

[build-dependencies]
napi-build = "2"
